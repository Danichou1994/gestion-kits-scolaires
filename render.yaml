services:
  - type: web
    name: gestion-kits-scolaires
    runtime: php
    buildCommand: |
      composer install --no-dev --optimize-autoloader --ignore-platform-req=php
      php artisan key:generate
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        sync: false